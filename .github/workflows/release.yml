name: Release

# A tag vX.Y.Z (or vX.Y.Z.N for a desktop-only release) builds the Windows installer
# and portable zip, smoke-tests the installer, and publishes them with SHA256SUMS on
# the GitHub Release. The tag must match wails.json info.productVersion.
# Run it by hand (workflow_dispatch) for a dry run: same build and tests, files kept as
# workflow artifacts, nothing published.
#
# Asset names are fixed so releases/latest/download/<name> always works:
#   tn5250-terminal-setup-x64.exe     per-user installer (no admin)
#   tn5250-terminal-portable-x64.zip  single exe, run from anywhere
#   SHA256SUMS                        sha256sum format, checked by Check for Updates

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Version
        id: version
        run: |
          $v = (Get-Content wails.json -Raw | ConvertFrom-Json).info.productVersion
          if ($v -notmatch '^\d+\.\d+\.\d+(\.\d+)?(-[0-9A-Za-z.-]+)?$') { throw "wails.json productVersion '$v' is not X.Y.Z[.N]" }
          if ('${{ github.ref_type }}' -eq 'tag' -and '${{ github.ref_name }}' -ne "v$v") {
            throw "Tag ${{ github.ref_name }} does not match wails.json productVersion $v"
          }
          "version=$v" >> $env:GITHUB_OUTPUT

      - run: npm ci
      - run: npm run check
      # Go embeds dist/desktop, so the page is built before vet and tests.
      - run: npm run build -- --production
      - run: go vet . ./internal/... ./cmd/...
      - run: go test . ./internal/...

      - name: Tools (Wails CLI, NSIS)
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            if (-not (Test-Path 'C:\Program Files (x86)\NSIS\makensis.exe')) { choco install nsis -y --no-progress }
            'C:\Program Files (x86)\NSIS' >> $env:GITHUB_PATH
          }

      - name: Build
        run: |
          wails build -trimpath -s -platform windows/amd64 -nsis -installscope user
          Get-ChildItem build/bin

      - name: Package
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item build/bin/tn5250-terminal-setup-x64.exe out/
          Compress-Archive -Path build/bin/tn5250-terminal.exe, LICENSE, README.md -DestinationPath out/tn5250-terminal-portable-x64.zip
          $lines = Get-ChildItem out -File | Sort-Object Name | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          }
          [IO.File]::WriteAllText("$PWD/out/SHA256SUMS", ($lines -join "`n") + "`n")
          Get-Content out/SHA256SUMS

      - name: Smoke test the installer (per-user, silent, locked exe, uninstall)
        run: |
          $setup = (Resolve-Path out/tn5250-terminal-setup-x64.exe).Path
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\TN5250 Terminal'
          $exe = Join-Path $dir 'tn5250-terminal.exe'
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\tn5250-terminal'
          function Run($file, $arguments) { (Start-Process $file -ArgumentList $arguments -Wait -PassThru).ExitCode }

          if (($c = Run $setup '/S') -ne 0) { throw "install exit code $c" }
          if (-not (Test-Path $exe)) { throw "not installed to $dir" }
          $shown = (Get-ItemProperty $key).DisplayVersion
          if ($shown -ne '${{ steps.version.outputs.version }}') { throw "uninstall key shows version '$shown'" }
          $fileVersion = (Get-Item $exe).VersionInfo.ProductVersion
          Write-Host "installed $exe, product version $fileVersion"

          # An exe that stays locked: setup retries, then fails with exit code 2.
          $lock = [IO.File]::Open($exe, 'Open', 'Read', 'None')
          try { $c = Run $setup '/S' } finally { $lock.Close() }
          if ($c -ne 2) { throw "locked exe: expected exit code 2, got $c" }

          # Released in time: setup succeeds.
          $lock = [IO.File]::Open($exe, 'Open', 'Read', 'None')
          $job = Start-Job { param($s) (Start-Process $s -ArgumentList '/S' -Wait -PassThru).ExitCode } -ArgumentList $setup
          Start-Sleep 4
          $lock.Close()
          $c = Receive-Job $job -Wait
          if ($c -ne 0) { throw "lock released after 4 s: expected exit code 0, got $c" }

          if (($c = Run (Join-Path $dir 'uninstall.exe') '/S') -ne 0) { throw "uninstall exit code $c" }
          # The uninstaller copies itself to %TEMP% and returns at once: wait for it.
          for ($i = 0; $i -lt 15 -and (Test-Path $exe); $i++) { Start-Sleep 1 }
          if (Test-Path $exe) { throw 'uninstall left the exe' }
          if (Test-Path $key) { throw 'uninstall left the registry key' }
          Write-Host 'installer smoke test passed'

      - uses: actions/upload-artifact@v4
        with:
          name: tn5250-terminal-${{ steps.version.outputs.version }}-windows
          path: out/

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $flags = @()
          if ($tag -match '-') { $flags += '--prerelease' }
          gh release create $tag out/tn5250-terminal-setup-x64.exe out/tn5250-terminal-portable-x64.zip out/SHA256SUMS `
            --title "TN5250 Terminal $tag" --generate-notes @flags
