name: Release

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node esbuild.mjs --production
      - run: npx @vscode/vsce package --no-dependencies -o tn5250-terminal.vsix
      - uses: softprops/action-gh-release@v2
        with:
          files: tn5250-terminal.vsix
      - run: npx @vscode/vsce publish --no-dependencies --packagePath tn5250-terminal.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
