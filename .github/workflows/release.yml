name: Release

# A tag vX.Y.Z (or vX.Y.Z.N for a desktop-only release) builds the app for Windows,
# Linux and macOS, smoke-tests each build, and publishes everything with one
# SHA256SUMS on the GitHub Release. The tag must match build/config.yml info.version.
#
# A push to a dry-run/** branch (or workflow_dispatch) runs the same jobs and keeps the
# files as workflow artifacts; nothing is published.
#
# Asset names are fixed so releases/latest/download/<name> always works:
#   tn5250-terminal-setup-x64.exe        Windows, per-user installer (no admin), silent /S
#   tn5250-terminal-x64.msi              Windows, per-machine MSI for IT deployment (msiexec /i ... /qn)
#   tn5250-terminal-portable-x64.zip     Windows, single exe, run from anywhere
#   tn5250-terminal-x86_64.AppImage      Linux, run anywhere (updates in place)
#   tn5250-terminal-linux-amd64.tar.gz   Linux, binary + desktop file + icon
#   tn5250-terminal_<ver>_amd64.deb      Debian / Ubuntu package
#   tn5250-terminal-macos-universal.dmg  macOS 11+, Intel and Apple silicon
#   tn5250-terminal-macos-universal.zip  the same .app, zipped
#   SHA256SUMS                           sha256sum format, checked by Check for Updates

on:
  push:
    tags: ['v*']
    branches: ['dry-run/**']
  workflow_dispatch:

permissions:
  contents: write

env:
  WAILS_VERSION: v3.1.0

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        shell: bash
        run: |
          # info.version in build/config.yml (the first version: line is the config schema).
          v=$(sed -n 's/^  version: *"\{0,1\}\([0-9][0-9.]*\)"\{0,1\}.*/\1/p' build/config.yml | head -n 1)
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::build/config.yml info.version '$v' is not X.Y.Z[.N]"; exit 1
          fi
          if [ "${{ github.ref_type }}" = "tag" ] && [ "${{ github.ref_name }}" != "v$v" ]; then
            echo "::error::Tag ${{ github.ref_name }} does not match build/config.yml info.version $v"; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - run: npm ci
      - run: npm run check
      - run: npm run build -- --production
      - run: go vet . ./internal/... ./cmd/...
      - run: go test . ./internal/...

      - name: Tools (Wails CLI, NSIS, WiX)
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@$env:WAILS_VERSION
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            if (-not (Test-Path 'C:\Program Files (x86)\NSIS\makensis.exe')) { choco install nsis -y --no-progress }
            'C:\Program Files (x86)\NSIS' >> $env:GITHUB_PATH
          }
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2

      - name: Build (installer + exe)
        run: |
          # build/windows/nsis/project.nsi is the per-user installer; the task fetches the
          # WebView2 bootstrapper and runs makensis with INSTALL_SCOPE=user.
          wails3 task windows:create:nsis:installer INSTALL_SCOPE=user 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error title=wails3 windows installer::$(((Get-Content build.log | Select-Object -Last 40) -join ' | ').Substring(0, [Math]::Min(3800, ((Get-Content build.log | Select-Object -Last 40) -join ' | ').Length)))"
            exit 1
          }
          Get-ChildItem build/bin

      - name: MSI (per-machine, for IT deployment)
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          # WixUI wants the license as RTF: wrap the MIT text.
          $lines = Get-Content LICENSE | ForEach-Object { ($_ -replace '\\', '\\\\' -replace '\{', '\{' -replace '\}', '\}') + '\par' }
          $rtf = '{\rtf1\ansi\deff0{\fonttbl{\f0 Consolas;}}\f0\fs18 ' + ($lines -join "`r`n") + '}'
          [IO.File]::WriteAllText("$PWD/out/license.rtf", $rtf)
          wix build -arch x64 -d Version=${{ needs.version.outputs.version }} -ext WixToolset.UI.wixext `
            -bindvariable WixUILicenseRtf=out/license.rtf -o out/tn5250-terminal-x64.msi build/windows/msi/Package.wxs 2>&1 | Tee-Object -FilePath msi.log
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error title=wix build::$(((Get-Content msi.log | Select-Object -Last 40) -join ' | '))"
            exit 1
          }
          Remove-Item out/license.rtf

      - name: Package
        run: |
          Copy-Item build/bin/tn5250-terminal-setup-x64.exe out/
          Compress-Archive -Path build/bin/tn5250-terminal.exe, LICENSE, README.md -DestinationPath out/tn5250-terminal-portable-x64.zip
          Get-ChildItem out

      - name: Smoke test the MSI (silent install, exe present, uninstall)
        run: |
          $msi = (Resolve-Path out/tn5250-terminal-x64.msi).Path
          $exe = 'C:\Program Files\TN5250 Terminal\tn5250-terminal.exe'
          $c = (Start-Process msiexec -ArgumentList "/i `"$msi`" /qn /l*v msi-install.log" -Wait -PassThru).ExitCode
          if ($c -ne 0) { Write-Host "::error title=msi install::exit $c; $((Get-Content msi-install.log | Select-String 'Error|error 1|return value 3' | Select-Object -Last 10) -join ' | ')"; exit 1 }
          if (-not (Test-Path $exe)) { throw "MSI did not install $exe" }
          $c = (Start-Process msiexec -ArgumentList "/x `"$msi`" /qn" -Wait -PassThru).ExitCode
          if ($c -ne 0) { throw "msi uninstall exit code $c" }
          if (Test-Path $exe) { throw 'MSI uninstall left the exe' }
          Write-Host 'MSI smoke test passed'

      - name: Smoke test the installer (per-user, silent, locked exe, uninstall)
        run: |
          $setup = (Resolve-Path out/tn5250-terminal-setup-x64.exe).Path
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\TN5250 Terminal'
          $exe = Join-Path $dir 'tn5250-terminal.exe'
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\tn5250-terminal'
          function Run($file, $arguments) { (Start-Process $file -ArgumentList $arguments -Wait -PassThru).ExitCode }

          if (($c = Run $setup '/S') -ne 0) { throw "install exit code $c" }
          if (-not (Test-Path $exe)) { throw "not installed to $dir" }
          $shown = (Get-ItemProperty $key).DisplayVersion
          if ($shown -ne '${{ needs.version.outputs.version }}') { throw "uninstall key shows version '$shown'" }
          $fileVersion = (Get-Item $exe).VersionInfo.ProductVersion
          Write-Host "installed $exe, product version $fileVersion"

          # An exe that stays locked: setup retries, then fails with exit code 2.
          $lock = [IO.File]::Open($exe, 'Open', 'Read', 'None')
          try { $c = Run $setup '/S' } finally { $lock.Close() }
          if ($c -ne 2) { throw "locked exe: expected exit code 2, got $c" }

          # Released in time: setup succeeds.
          $lock = [IO.File]::Open($exe, 'Open', 'Read', 'None')
          $job = Start-Job { param($s) (Start-Process $s -ArgumentList '/S' -Wait -PassThru).ExitCode } -ArgumentList $setup
          Start-Sleep 4
          $lock.Close()
          $c = Receive-Job $job -Wait
          if ($c -ne 0) { throw "lock released after 4 s: expected exit code 0, got $c" }

          if (($c = Run (Join-Path $dir 'uninstall.exe') '/S') -ne 0) { throw "uninstall exit code $c" }
          # The uninstaller copies itself to %TEMP% and returns at once: wait for it.
          for ($i = 0; $i -lt 15 -and (Test-Path $exe); $i++) { Start-Sleep 1 }
          if (Test-Path $exe) { throw 'uninstall left the exe' }
          if (Test-Path $key) { throw 'uninstall left the registry key' }
          Write-Host 'installer smoke test passed'

      - uses: actions/upload-artifact@v5
        with:
          name: windows
          path: out/

  linux:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build dependencies (GTK 4, WebKitGTK 6.0, xvfb for the smoke test)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev xvfb dbus-x11

      - run: npm ci
      - run: npm run check
      - run: npm run build -- --production
      - run: go vet . ./internal/... ./cmd/...
      - run: go test . ./internal/...
      - run: go install github.com/wailsapp/wails/v3/cmd/wails3@$WAILS_VERSION

      - name: Build
        run: |
          set -o pipefail
          wails3 task linux:build 2>&1 | tee build.log || {
            echo "::error title=wails3 task linux:build::$(tail -n 40 build.log | tr '\n' '|' | cut -c1-3800)"; exit 1; }
          ls -la build/bin
          ldd build/bin/tn5250-terminal | grep -q webkitgtk-6.0 || { echo "::error::binary is not linked against webkitgtk-6.0"; exit 1; }

      - name: Package (tar.gz, .deb, AppImage)
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p out stage/tn5250-terminal
          cp build/bin/tn5250-terminal build/linux/tn5250-terminal.desktop LICENSE README.md stage/tn5250-terminal/
          cp build/appicon.png stage/tn5250-terminal/tn5250-terminal.png
          cp build/linux/install.sh stage/tn5250-terminal/
          chmod +x stage/tn5250-terminal/install.sh
          tar -C stage -czf out/tn5250-terminal-linux-amd64.tar.gz tn5250-terminal

          # .deb
          deb=stage/deb
          mkdir -p "$deb/DEBIAN" "$deb/usr/bin" "$deb/usr/share/applications" "$deb/usr/share/icons/hicolor/512x512/apps" "$deb/usr/share/doc/tn5250-terminal"
          cp build/bin/tn5250-terminal "$deb/usr/bin/"
          cp build/linux/tn5250-terminal.desktop "$deb/usr/share/applications/"
          cp build/appicon.png "$deb/usr/share/icons/hicolor/512x512/apps/tn5250-terminal.png"
          cp LICENSE "$deb/usr/share/doc/tn5250-terminal/copyright"
          size=$(du -sk "$deb/usr" | cut -f1)
          cat > "$deb/DEBIAN/control" <<EOF
          Package: tn5250-terminal
          Version: $VERSION
          Section: net
          Priority: optional
          Architecture: amd64
          Depends: libgtk-4-1, libwebkitgtk-6.0-4
          Installed-Size: $size
          Maintainer: DerKyberTakt <DerKyberTakt@users.noreply.github.com>
          Homepage: https://github.com/DerKyberTakt/tn5250-desktop
          Description: 5250 terminal emulator for IBM i
           TN5250 Terminal connects to IBM i (AS/400) systems over telnet or TLS with the
           keyboard and look of IBM i Access Client Solutions, and browses the IFS.
          EOF
          sed -i 's/^          //' "$deb/DEBIAN/control"
          dpkg-deb --build --root-owner-group "$deb" "out/tn5250-terminal_${VERSION}_amd64.deb"
          dpkg-deb --info "out/tn5250-terminal_${VERSION}_amd64.deb"

          # AppImage
          appdir=stage/AppDir
          mkdir -p "$appdir/usr/bin"
          cp build/bin/tn5250-terminal "$appdir/usr/bin/"
          cp build/linux/tn5250-terminal.desktop "$appdir/"
          cp build/appicon.png "$appdir/tn5250-terminal.png"
          ln -s usr/bin/tn5250-terminal "$appdir/AppRun"
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run "$appdir" out/tn5250-terminal-x86_64.AppImage 2>&1 | tee appimage.log || {
            echo "::error title=appimagetool::$(tail -n 30 appimage.log | tr '\n' '|' | cut -c1-3800)"; exit 1; }
          ls -la out

      - name: Smoke test (the binary starts and stays up for 8 s under Xvfb)
        run: |
          set +e
          dbus-run-session -- xvfb-run -a timeout 8 build/bin/tn5250-terminal --demo > smoke.log 2>&1
          rc=$?
          set -e
          if [ "$rc" -ne 124 ]; then
            echo "::error title=linux smoke test::exit $rc; $(tail -n 30 smoke.log | tr '\n' '|' | cut -c1-3500)"; exit 1
          fi
          echo "started and ran until the timeout (exit 124): ok"

      - uses: actions/upload-artifact@v5
        with:
          name: linux
          path: out/

  macos:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - run: npm ci
      - run: npm run check
      - run: npm run build -- --production
      - run: go vet . ./internal/... ./cmd/...
      - run: go test . ./internal/...
      - run: go install github.com/wailsapp/wails/v3/cmd/wails3@$WAILS_VERSION

      - name: Build (universal .app)
        run: |
          set -o pipefail
          # build:universal + .app bundle + ad-hoc signature (the app is not notarized; an ad-hoc
          # signed binary runs after the user allows it: right-click > Open, or xattr -dr com.apple.quarantine).
          wails3 task darwin:package:universal 2>&1 | tee build.log || {
            echo "::error title=wails3 task darwin:package:universal::$(tail -n 40 build.log | tr '\n' '|' | cut -c1-3800)"; exit 1; }
          ls -la build/bin
          mv "build/bin/tn5250-terminal.app" "build/bin/TN5250 Terminal.app"
          app="build/bin/TN5250 Terminal.app"
          lipo -archs "$app/Contents/MacOS/tn5250-terminal"
          codesign --verify --verbose=2 "$app"

      - name: Package (.dmg, .zip)
        run: |
          set -euo pipefail
          mkdir -p out
          app="build/bin/TN5250 Terminal.app"
          ditto -c -k --keepParent "$app" out/tn5250-terminal-macos-universal.zip
          mkdir -p stage/dmg
          cp -R "$app" stage/dmg/
          ln -s /Applications stage/dmg/Applications
          hdiutil create -volname "TN5250 Terminal" -srcfolder stage/dmg -ov -format UDZO out/tn5250-terminal-macos-universal.dmg
          ls -la out

      - name: Smoke test (the app starts and stays up for 8 s)
        run: |
          app="build/bin/TN5250 Terminal.app"
          "$app/Contents/MacOS/tn5250-terminal" --demo > smoke.log 2>&1 &
          pid=$!
          sleep 8
          if kill -0 "$pid" 2>/dev/null; then
            kill "$pid"; echo "started and stayed up: ok"
          else
            echo "::error title=macos smoke test::the app exited early; $(tail -n 30 smoke.log | tr '\n' '|' | cut -c1-3500)"; exit 1
          fi

      - uses: actions/upload-artifact@v5
        with:
          name: macos
          path: out/

  publish:
    needs: [version, windows, linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: assets
          merge-multiple: true
      - name: SHA256SUMS
        run: |
          cd assets
          sha256sum $(ls | sort) > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@v5
        with:
          name: tn5250-terminal-${{ needs.version.outputs.version }}-all
          path: assets/
      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag='${{ github.ref_name }}'
          flags=()
          case "$tag" in *-*) flags+=(--prerelease);; esac
          gh release create "$tag" assets/* --repo "$GITHUB_REPOSITORY" --title "TN5250 Terminal $tag" --generate-notes "${flags[@]}"
