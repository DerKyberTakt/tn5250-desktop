name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node esbuild.mjs --production
      - run: npx @vscode/vsce package --no-dependencies -o tn5250-terminal.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: tn5250-terminal.vsix
          path: tn5250-terminal.vsix
