name: CI

# Every push to main (and to a ci/** branch, for trying changes without a release)
# typechecks, lints and tests the page, vets and tests the Go host, and builds the
# app on each supported platform so a build break shows up before a release.

on:
  push:
    branches: [main, 'ci/**']
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            task: windows:build
          - os: ubuntu-24.04
            task: linux:build
          - os: macos-latest
            task: darwin:build:universal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Linux build dependencies (GTK 4, WebKitGTK 6.0)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev

      - run: npm ci
      - run: npm run check
      # Go embeds dist/desktop, so the page is built before vet and tests.
      - run: npm run build -- --production
      - run: go vet . ./internal/... ./cmd/...
      - run: go test . ./internal/...

      - name: Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0

      - name: Build (${{ matrix.task }})
        shell: bash
        run: |
          set -o pipefail
          wails3 task ${{ matrix.task }} 2>&1 | tee build.log || {
            echo "::error title=wails3 task ${{ matrix.task }}::$(tail -n 40 build.log | tr '\n' '|' | cut -c1-3800)"
            exit 1
          }
          ls -la build/bin
